name: Live API smoke test

on:
  # Run manually after the backend deploy is confirmed and smoke credentials are configured.
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Deployed VitalGuard API base URL"
        required: false
        default: "https://vitalguard-risk-api-dc.onrender.com"
        type: string

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test deployed API end-to-end
        env:
          VITALGUARD_API_URL: ${{ inputs.api_base_url }}
          VITALGUARD_SMOKE_USERNAME: ${{ secrets.VITALGUARD_SMOKE_USERNAME }}
          VITALGUARD_SMOKE_PASSWORD: ${{ secrets.VITALGUARD_SMOKE_PASSWORD }}
        run: node scripts/smoke-test.mjs
