name: Browser end-to-end tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright for CI
        timeout-minutes: 4
        run: npm install --no-save --package-lock=false --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=1 @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Test local production build
        run: npx playwright test

  live-browser-smoke:
    needs: browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright for CI
        timeout-minutes: 4
        run: npm install --no-save --package-lock=false --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=1 @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed frontend routes and refreshes
        env:
          E2E_BASE_URL: https://vitalguard-ai-dc.onrender.com
        run: npx playwright test
